<div class="checkout-container">
    <h2>Checkout</h2>
    <form (ngSubmit)="onSubmit()" #checkoutForm="ngForm">
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" [(ngModel)]="name" required minlength="3" #nameInput="ngModel">
            <div *ngIf="nameInput.invalid && (nameInput.dirty || nameInput.touched)" class="error">
                Name is required (min 3 chars).
            </div>
        </div>

        <div class="form-group">
            <label for="address">Address</label>
            <input type="text" id="address" name="address" [(ngModel)]="address" required #addressInput="ngModel">
            <div *ngIf="addressInput.invalid && (addressInput.dirty || addressInput.touched)" class="error">
                Address is required.
            </div>
        </div>

        <div class="form-group">
            <label for="creditCard">Credit Card</label>
            <input type="text" id="creditCard" name="creditCard" [(ngModel)]="creditCard" required pattern="[0-9]{16}"
                #ccInput="ngModel">
            <div *ngIf="ccInput.invalid && (ccInput.dirty || ccInput.touched)" class="error">
                Valid 16-digit credit card required.
            </div>
        </div>

        <button type="submit" [disabled]="checkoutForm.invalid">Submit Order</button>
    </form>
</div>
