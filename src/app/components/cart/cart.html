<div class="cart-container">
    <h2>Shopping Cart</h2>
    <div *ngIf="cartItems.length === 0">
        <p>Cart is empty</p>
        <a routerLink="/">Go to Products</a>
    </div>

    <div *ngIf="cartItems.length > 0">
        <div class="cart-item" *ngFor="let item of cartItems">
            <img [src]="item.product.url" [alt]="item.product.name" class="cart-image">
            <div class="item-details">
                <h3>{{ item.product.name }}</h3>
                <p>${{ item.product.price }}</p>
            </div>
            <div class="item-actions">
                <input type="number" min="0" [(ngModel)]="item.quantity" (ngModelChange)="updateQuantity(item, $event)">
                <button (click)="removeItem(item)">Remove</button>
            </div>
        </div>

        <div class="cart-total">
            <h3>Total: ${{ total | number:'1.2-2' }}</h3>
        </div>

        <a routerLink="/checkout" class="checkout-btn">Proceed to Checkout</a>
    </div>
</div>
